<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- © 2026 مهند رضا — جميع الحقوق محفوظة / All rights reserved -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قارئ الفصول الملوّن</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--ink:#1d2433;--paper:#fbfcfe;--muted:#5d6678;--bar:#ffffffee;--line:#d9deea;--card:#ffffff;--fs:19px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ecf5;--paper:#12151c;--muted:#9aa3b8;--bar:#12151cee;--line:#2a3040;--card:#1a1f2b;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e8ecf5;--paper:#12151c;--muted:#9aa3b8;--bar:#12151cee;--line:#2a3040;--card:#1a1f2b;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.home,.view{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.view{display:none}
.brand{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.logo{width:60px;height:60px;flex:none}
.brand h1{margin:0;font-size:27px;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.rb{height:5px;border-radius:3px;margin:0 0 18px;background:linear-gradient(to left,hsl(210 70% 55%),hsl(348 70% 58%),hsl(125 55% 48%),hsl(263 60% 60%),hsl(40 85% 55%),hsl(178 60% 45%))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px #0000000d}
.hero{margin-bottom:14px}
.hero small{color:var(--muted)}
.hero h2{margin:4px 0 6px;font-size:20px;line-height:1.5}
.cta{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;text-align:start;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);cursor:pointer;position:relative}
.act input{position:absolute;opacity:0;width:1px;height:1px}
.act .ic{font-size:26px;line-height:1.2}
.act b{font-size:17px}
.act small{color:var(--muted);font-size:13px}
.act.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.act.big small{color:inherit;opacity:.75}
.act:focus-within,.act:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sec-t{font-size:16px;margin:0 0 10px}
.bk{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;border-inline-start:8px solid hsl(var(--h) 60% 50%)}
.bk .n{flex:1;min-width:0}
.bk .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .n small{color:var(--muted);font-size:13px}
.seg{display:flex;gap:2px;height:6px;margin-top:8px}
.seg i{flex:1;border-radius:3px;background:hsl(var(--c) 70% 52%)}
.bk .x{border-color:transparent;color:#c0392b;font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h2{flex:1;margin:0;font-size:22px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.sg{display:flex;gap:6px}
.sg button.on{background:var(--ink);color:var(--paper)}
.muted{color:var(--muted);text-align:center;font-size:14px;margin-top:18px}
.err{color:#c0392b;min-height:1.4em;margin:0 0 10px}
#reader{display:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:8px 12px}
.row{display:flex;gap:8px;align-items:center}
.row .t{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{flex:none;border:0;border-radius:999px;padding:4px 12px;font-size:14px;color:#fff;background:hsl(var(--h) 55% 42%)}
.chip.on{outline:2px solid var(--ink);outline-offset:2px}
.prog{height:3px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink)}
.ch{background:hsl(var(--h) 65% 92%);border-inline-start:8px solid hsl(var(--h) 55% 45%);padding:28px 18px 36px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ch{background:hsl(var(--h) 28% 17%)}}
:root[data-theme="dark"] .ch{background:hsl(var(--h) 28% 17%)}
.pre{padding:28px 18px 36px;border-inline-start:8px solid var(--line)}
.in{max-width:44rem;margin:0 auto;font-size:var(--fs);line-height:2}
.in p{margin:0 0 .9em;white-space:pre-wrap}
.in h1,.in h2,.in h3{line-height:1.5}
.ct{font-weight:700;font-size:1.35em;margin:0 0 1em;padding-bottom:.4em;border-bottom:2px solid hsl(var(--h) 55% 45%)}
.in img{max-width:100%}
.in table{display:block;overflow-x:auto}
</style>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="home" id="start">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="6" y="14" width="10" height="38" rx="3" fill="hsl(210 70% 55%)"/>
      <rect x="18" y="8" width="10" height="44" rx="3" fill="hsl(348 70% 58%)"/>
      <rect x="30" y="16" width="10" height="36" rx="3" fill="hsl(125 55% 48%)"/>
      <rect x="42" y="10" width="10" height="42" rx="3" fill="hsl(40 85% 55%)"/>
      <rect x="54" y="18" width="6" height="34" rx="3" fill="hsl(263 60% 60%)"/>
      <rect x="3" y="53" width="58" height="4" rx="2" fill="currentColor"/>
    </svg>
    <div><h1>قارئ الفصول</h1><p>لكل فصل لونه، وحماسك يكمل الكتاب</p></div>
  </div>
  <div class="rb"></div>
  <div class="err" id="err" role="alert"></div>
  <div id="hero"></div>
  <div class="grid">
    <label class="act big"><input type="file" id="file" accept=".docx,.pdf,.txt,.md,text/plain,application/pdf"><span class="tile"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span class="tx"><b>كتاب جديد</b><small>Word · PDF · TXT</small></span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></label>
    <button class="act" id="goLib"><span class="tile t2"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="4.500" height="16" rx="1.200"/><rect x="10" y="4" width="4.500" height="16" rx="1.200"/><path d="M16.500 6.500l3.800-1 3 0"/><path d="M17 5.500l3.200 14 -3.300.8"/></svg></span><b>كتبي</b><small id="libCount"></small></button>
    <button class="act" id="goSet"><span class="tile t3"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.200"/><circle cx="9" cy="17" r="2.200"/></svg></span><b>الإعدادات</b><small>المظهر والخط</small></button>
  </div>
  <div id="recent"></div>
</div>
<div class="view" id="libview">
  <div class="top"><button class="ib" id="back1" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><h2>كتبي</h2></div>
  <div id="liblist"></div>
</div>
<div class="view" id="setview">
  <div class="top"><button class="ib" id="back2" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><h2>الإعدادات</h2></div>
  <div class="card">
    <div class="row2"><span>المظهر</span><span class="sg" id="thm"><button data-v="auto">تلقائي</button><button data-v="light">فاتح</button><button data-v="dark">داكن</button></span></div>
    <div class="row2"><span>حجم الخط</span><input type="range" id="fsr" min="14" max="44" step="1"></div>
    <div class="row2"><label for="auto">فتح آخر كتاب عند التشغيل</label><input type="checkbox" id="auto"></div>
  </div>
  <p class="muted">للتكبير والتصغير أثناء القراءة: ضع إصبعين على الشاشة وقرّبهما أو باعدهما.</p>
  <p class="muted">قارئ الفصول · كل فصل بلون</p>
</div>
<div class="view" id="aboutview"></div>
<div id="reader">
  <header>
    <div class="row"><button class="ib" id="again" aria-label="الرئيسية"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5M5.5 10v9.5h13V10"/></svg></button><span class="t" id="title"></span></div>
    <div class="chips" id="chips"></div>
    <div class="prog"><i id="bar"></i></div>
  </header>
  <main id="book"></main>
</div>
<script>
var CH=/^\s*(الفصل|الباب|chapter|chapitre|capítulo|kapitel)(\s+|:|-|$)/i;
var EXC=/^\s*(الفصل|الباب)\s+(التالي|السابق|القادم|الماضي|هذا|الذي)/;
var PLAIN=/^\s*(الفهرس|فهرس|المراجع|المصادر|قائمة المصادر|الخاتمة|خاتمة|الملاحق|ملحق|contents|table of contents|index|bibliography|references|appendix|epilogue)\s*[:\-]?\s*$/i;
var el=function(id){return document.getElementById(id)};
var fs=19;
var VIEWS=["start","libview","setview","aboutview","reader"];
function showView(n){VIEWS.forEach(function(v){el(v).style.display=v===n?"block":"none"});window.scrollTo(0,0);if(n!=="reader"&&window.closeAllPanels)window.closeAllPanels()}
function hueOf(i){return Math.round((210+i*137.508)%360)}
function kindOf(t){t=(t||"").trim();if(!t||t.length>=80)return null;if(/\.{3,}|…|·{3,}/.test(t))return null;if(PLAIN.test(t))return"plain";if(CH.test(t)&&!EXC.test(t))return"ch";return null}

function fromText(s){
  var out=[];
  s.replace(/\r\n?/g,"\n").split("\n").forEach(function(line){
    if(!line.trim())return;
    var p=document.createElement("p");p.textContent=line;p.dir="auto";
    out.push({node:p,kind:kindOf(line),txt:true});
  });
  return out;
}
function fromHtml(h){
  var box=document.createElement("div");box.innerHTML=h;
  var out=[];
  Array.prototype.forEach.call(box.children,function(n){
    n.dir="auto";
    out.push({node:n,kind:kindOf(n.textContent)||(/^H[1-2]$/.test(n.tagName)?"h":null)});
  });
  return out;
}
function plan(items){
  var main=items.some(function(x){return x.kind==="ch"})?"ch":"h",secs=[],cur=null;
  items.forEach(function(it){
    var k=it.kind==="plain"?"plain":(it.kind===main?"ch":null);
    if(!cur||k==="ch"||(k==="plain"&&cur.colored)){
      cur={colored:k==="ch",title:k==="ch"?it.node.textContent.trim():"",nodes:[]};secs.push(cur);
    }
    cur.nodes.push(it);
  });
  return secs;
}
function trimToc(secs){
  if(secs.filter(function(s){return s.colored}).length<2)return secs;
  secs.forEach(function(s,i){
    if(!s.colored||i===secs.length-1)return;
    var n=s.nodes.reduce(function(a,it){return a+(it.node.textContent||"").length},0);
    if(n<250)s.colored=false;
  });
  var out=[];
  secs.forEach(function(s){var l=out[out.length-1];if(l&&!l.colored&&!s.colored)l.nodes=l.nodes.concat(s.nodes);else out.push(s)});
  return out;
}
function render(items,name){loadBook({type:"text",items:items,name:name})}
function track(){
  var secs=document.querySelectorAll(".ch"),chips=document.querySelectorAll(".chip"),act=0;
  secs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)act=i});
  chips.forEach(function(c,i){c.classList.toggle("on",i===act)});
  if(chips[act]&&act!==window.lastAct){
    window.lastAct=act;
    var bx=el("chips"),cr=chips[act].getBoundingClientRect(),br=bx.getBoundingClientRect();
    bx.scrollBy({left:(cr.left+cr.width/2)-(br.left+br.width/2)});
  }
  var m=document.documentElement.scrollHeight-innerHeight;
  el("bar").style.width=(m>0?Math.min(100,scrollY/m*100):0)+"%";
}
var pend=false;
addEventListener("scroll",function(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;if(el("reader").style.display==="block")track()})});

function openBook(f){
  el("err").textContent="";
  var n=f.name.replace(/\.[^.]+$/,""),ext=(f.name.split(".").pop()||"").toLowerCase();
  if(ext==="docx"){
    if(!window.mammoth){el("err").textContent="تعذّر تحميل قارئ Word. تحقق من الاتصال وأعد المحاولة.";return}
    f.arrayBuffer().then(function(b){return mammoth.convertToHtml({arrayBuffer:b})})
     .then(function(r){render(fromHtml(r.value),n)})
     .catch(function(){el("err").textContent="تعذّر قراءة ملف Word هذا."});
  }else if(ext==="txt"||ext==="md"){
    f.text().then(function(t){render(fromText(t),n)});
  }else if(ext==="pdf"){
    window.openPdf(f,n);
  }else{el("err").textContent="هذه الصيغة غير مدعومة بعد."}
}
el("file").onchange=function(e){var f=e.target.files[0];if(f)openBook(f)};
function setFs(d){fs=Math.max(14,Math.min(34,fs+d));document.documentElement.style.setProperty("--fs",fs+"px")}
el("again").onclick=function(){showView("start");el("file").value=""};
</script>
<script src="extra.js"></script>
<script src="split.js"></script>
<script src="zoom.js"></script>
<script src="lib.js"></script>
<script src="ink.js"></script>
<script src="about.js"></script>
</body>
</html>
